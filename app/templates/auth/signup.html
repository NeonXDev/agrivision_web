{% extends 'base.html' %}

{% block title %}Create account · AgriVision Nepal{% endblock %}

{% block content %}
  <div class="card auth-card">
    <h1 style="font-size: 1.4rem; margin-bottom: 8px;">Create an account</h1>
    <p class="text-muted" style="font-size: 0.88rem; margin-bottom: 20px;">Track your field scans and local market price history.</p>

    <div style="display: flex; flex-direction: column; gap: 12px; text-align: left; margin-bottom: 16px;">
      <div>
        <label style="display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px;">Full name</label>
        <input type="text" placeholder="Ram Bahadur Shrestha" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 0.9rem; background: var(--surface); color: inherit;">
      </div>
      <div>
        <label style="display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px;">Email address</label>
        <input type="email" placeholder="ram@example.com" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 0.9rem; background: var(--surface); color: inherit;">
      </div>
      <div>
        <label style="display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px;">Password</label>
        <input type="password" placeholder="Create a password" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 0.9rem; background: var(--surface); color: inherit;">
      </div>
    </div>

    <a href="{{ url_for('home.index') }}" class="btn-primary btn-block">Register account</a>

    <p class="auth-footer">
      Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--green); font-weight: 600;">Sign in</a>
    </p>
  </div>
{% endblock %}
