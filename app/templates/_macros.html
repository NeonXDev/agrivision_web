{# Reusable minimal template macros #}

{% macro empty_state(title, subtitle='') %}
<div class="empty-state">
  <h2>{{ title }}</h2>
  {% if subtitle %}<p>{{ subtitle }}</p>{% endif %}
</div>
{% endmacro %}

{% macro primary_button(text, href) %}
<a href="{{ href }}" class="btn-primary btn-block">
  {{ text }}
</a>
{% endmacro %}

{% macro outline_button(text, href) %}
<a href="{{ href }}" class="btn-outline btn-block">
  {{ text }}
</a>
{% endmacro %}
