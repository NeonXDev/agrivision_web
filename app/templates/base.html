<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AgriVision Nepal{% endblock %}</title>

  <!-- Applied before CSS loads, so there's no flash of the wrong theme. -->
  <script>
    (function () {
      var saved = localStorage.getItem('agrivision-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    <a href="{{ url_for('home.index') }}" class="navbar-brand">🌱 AgriVision Nepal</a>
    <div class="navbar-links">
      <a href="{{ url_for('home.index') }}">Home</a>
      <a href="{{ url_for('history.index') }}">History</a>
      <a href="{{ url_for('settings.index') }}">Settings</a>
      <a href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
